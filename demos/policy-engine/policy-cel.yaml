# Praxis Policy Engine policy document for the HR demo — CEL variant.
#
# Identical to policy-cedar.yaml EXCEPT the PDP backend for the search_repos
# route: this config uses CEL (Common Expression Language) instead of
# Cedar. Both express the same decision ("engineers read internal repos;
# security reads any") — see policy-cedar.yaml for the Cedar form. Run this
# variant with:  GATEWAY_CONFIG=praxis-cel.yaml ./restart.sh
#
# Hot path:
#   1. jwt-user      validates X-User-Token against Keycloak (policy-demo realm)
#                    → security.subject + raw_credentials.inbound_tokens[User]
#   2. jwt-client    validates Authorization against Keycloak (same realm)
#                    → security.client
#   3. APL gate      require(role.hr) on the get_compensation tool
#   4. APL delegate  workday-oauth exchanges the user's IdP token for an
#                    audience=workday-api token via Keycloak (RFC 8693)
#   5. APL args      ssn arg gets redacted unless caller has perm.view_ssn
#
# Keycloak runs locally at http://localhost:8081. JWTs are RS256-signed
# by the realm's automatically-generated signing key. We point at the
# realm's JWKS URL so the resolver fetches the active public key at
# init time (no manual PEM paste).

engine_settings:
  dispatch: policy

plugins:
  # User identity. Carries the human's roles + permissions claims.
  - name: jwt-user
    capabilities:
      # PPE performs no outbound HTTP of its own, so a plugin that reaches an
      # IdP declares this or the engine refuses to start.
      - perform_http
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: user
      header: X-User-Token
      trusted_issuers:
        - issuer: "http://localhost:8081/realms/policy-demo"
          audiences: ["praxis-gateway"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/certs"
            insecure_http: true   # localhost dev — never production
          leeway_seconds: 60
        - issuer: "https://praxis-1.verify.ibm.com/oauth2"
          audiences: ["praxis-gateway"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "https://praxis-1.verify.ibm.com/oauth2/jwks"
          leeway_seconds: 60
      claim_mapper: standard

  # Client identity. Carries the agent's client_id / azp.
  - name: jwt-client
    capabilities:
      # PPE performs no outbound HTTP of its own, so a plugin that reaches an
      # IdP declares this or the engine refuses to start.
      - perform_http
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: client
      header: Authorization
      trusted_issuers:
        - issuer: "http://localhost:8081/realms/policy-demo"
          audiences: ["praxis-gateway", "account"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/certs"
            insecure_http: true   # localhost dev — never production
          leeway_seconds: 60
        - issuer: "https://praxis-1.verify.ibm.com/oauth2"
          audiences: ["praxis-gateway", "account"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "https://praxis-1.verify.ibm.com/oauth2/jwks"
          leeway_seconds: 60
      claim_mapper: standard

  # Workload identity: the calling agent's SPIFFE JWT-SVID, presented on
  # X-Workload-Token and validated against SPIRE's keys (the spire-oidc
  # discovery provider on :8443). It fills security.caller_workload, which a
  # `delegate(..., subject: caller_workload)` step reads.
  #
  # Only the get_headcount route names it (see routes:), with
  # replace_inherited, so that route authenticates by the SVID alone. Every
  # other route is unaffected, which is why it can be on_error: fail. Without
  # the SPIRE overlay running, the gateway still starts: the initial key fetch
  # soft-fails and only get_headcount is denied (auth.jwks_unavailable).
  #
  # SPIRE signs JWT-SVIDs with EC keys (ES256), and the SVID's audience is the
  # realm issuer, because the SVID is presented to Keycloak as a client
  # assertion and the SPIFFE client-auth draft requires that audience.
  - name: jwt-workload
    capabilities:
      - perform_http
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: caller_workload
      header: X-Workload-Token
      trusted_issuers:
        - issuer: "http://spire-oidc:8443"
          audiences: ["http://localhost:8081/realms/policy-demo"]
          algorithms: ["ES256"]
          decoding_key:
            kind: jwks_url
            # Reached from the host gateway on the published port
            # (inside compose it is spire-oidc:8443).
            url: "http://localhost:8443/keys"
            insecure_http: true   # localhost dev — never production
          leeway_seconds: 60
      claim_mapper: standard

  # RFC 8693 token-exchange delegator. Trades the user's hr-copilot
  # token for a workday-api-audience-scoped access token.
  #
  # Pattern 1 (workday flow): the user already carries view_ssn etc.
  # as a Keycloak user attribute → claim. The exchange just changes
  # the audience; the perms come along for the ride.
  - name: workday-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    mode: sequential
    on_error: fail
    capabilities:
      # PPE performs no outbound HTTP of its own, so a plugin that reaches an
      # IdP declares this or the engine refuses to start.
      - perform_http
      - read_inbound_credentials
      - write_delegated_tokens
    config:
      token_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/token"
      insecure_http: true   # localhost dev — never production
      client_id: "praxis-gateway"
      # Secret source. `kind: literal` is an inline secret (dev only).
      # Other kinds: `kind: env_var` with `name:` (read from the
      # environment at startup) and `kind: file` with `path:` (read from
      # a file). Prefer env_var or file in production; do not commit
      # secrets to YAML.
      client_secret_source:
        kind: literal
        secret: "praxis-gateway-secret"
      timeout_seconds: 5
      default_outbound_header: "Authorization"

  # ----------------------------------------------------------------
  # Field-level validator: PII scanner.
  # ----------------------------------------------------------------
  # Walks tool/prompt arguments looking for SSN / credit-card / email
  # patterns. If found in `deny` mode, refuses the request. Wired on
  # `cmf.tool_pre_invoke` so it fires before every tool call.
  - name: pii-scan
    kind: validator/pii-scan
    hooks: [cmf.tool_pre_invoke]
    mode: sequential
    on_error: fail
    config:
      detect:
        - { kind: ssn }
        - { kind: credit_card }
      mode: deny

  # ----------------------------------------------------------------
  # Observation: structured audit logger.
  # ----------------------------------------------------------------
  # Emits one JSON line per dispatched request capturing subject,
  # client, entity, tool args, and any delegation outcomes. Never
  # blocks — observation only.
  #
  # One hook, because this demo declares only `tool:` routes. Under
  # `dispatch: policy` a plugin runs where a `run(name)` step names it, so
  # declaring the prompt and resource hooks too would leave two of the three
  # uncovered and the load would say so. Add them back alongside the routes
  # that need them.
  - name: audit-log
    kind: audit/logger
    hooks:
      - cmf.tool_pre_invoke
    mode: sequential
    # Ordering is the order the document writes the steps: a `run(name)`
    # step invokes the one plugin it names, so this records the final
    # decision and the minted tokens by sitting last.
    on_error: ignore  # observation failures don't halt traffic
    capabilities:
      - read_subject
      - read_client
      - read_meta
      - read_delegated_tokens
    config:
      destination: stderr
      source: policy-demo-gateway

  # Second delegator — same plugin kind, different audience.
  #
  # Pattern 3 (github flow): the user's inbound token does NOT
  # carry github perms. The github-api client in Keycloak has a
  # per-audience claim mapper (`gh-permissions-as-scope`) that
  # injects `gh_permissions` from the user attribute as the
  # minted token's `permissions` claim. The IdP is the source of
  # system-specific perm truth; the gateway just asks.
  - name: github-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    mode: sequential
    on_error: fail
    capabilities:
      # PPE performs no outbound HTTP of its own, so a plugin that reaches an
      # IdP declares this or the engine refuses to start.
      - perform_http
      - read_inbound_credentials
      - write_delegated_tokens
    config:
      token_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/token"
      insecure_http: true
      client_id: "praxis-gateway"
      client_secret_source:
        kind: literal
        secret: "praxis-gateway-secret"
      timeout_seconds: 5
      default_outbound_header: "Authorization"

  # ----------------------------------------------------------------
  # Human-in-the-loop: CIBA manager approval.
  # ----------------------------------------------------------------
  # Drives an out-of-band approval through OIDC CIBA: the gateway POSTs
  # a backchannel auth request to Keycloak (login_hint = the approver),
  # Keycloak pushes a decoupled prompt to the approver's device (the
  # demo's web approval UI), and the gateway polls until it resolves.
  # While pending, the gateway emits JSON-RPC -32120 so the agent can
  # tell the user "awaiting sign-off" and retry — it never blocks.
  # Registered under the name `manager-approver`; the route names it.
  - name: manager-approver
    capabilities:
      # PPE performs no outbound HTTP of its own, so a plugin that reaches an
      # IdP declares this or the engine refuses to start.
      - perform_http
    kind: elicitation/ciba
    hooks: [elicit]
    mode: sequential
    on_error: fail
    config:
      backchannel_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/ext/ciba/auth"
      token_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/token"
      insecure_http: true   # localhost dev — never production
      client_id: "praxis-gateway"
      client_secret_source:
        kind: literal
        secret: "praxis-gateway-secret"
      scope: openid
      approver_claim: preferred_username
      default_requested_expiry_seconds: 120

global:
  authentication:
    - jwt-user
    - jwt-client

  # ----------------------------------------------------------------
  # Assertions — what the engine puts on the wire.
  # ----------------------------------------------------------------
  # Everything above this block decides. This is the only thing that tells the
  # upstream what was decided, as request headers it can read.
  #
  # The trust model first, because it is the whole story: what crosses here is
  # UNSIGNED. hr-mcp believes `x-auth-user-id` because it believes nothing
  # between this gateway and itself can set that header. If that is not true of
  # your network, this feature is not what makes it true.
  #
  # Sources are engine-derived only. A raw inbound token and the client's own
  # request headers are refused as sources, in code, with no config surface to
  # widen: rendering a client-supplied header into one the upstream trusts is
  # the laundering this exists to prevent. Scenario 12 demonstrates that.
  assertions:
    request:
      headers:
        # The stable subject identifier the JWT resolved to (`sub`).
        # `on_missing: deny` because every route here authenticates, so an
        # absent subject is a bug rather than an anonymous request to pass on.
        - name: x-auth-user-id
          from: subject.id
          on_missing: deny

        # The human-readable name, for the demo log. A claim, not a slot.
        - name: x-auth-username
          from: claim.preferred_username

        # A collection MUST declare an encoding: a set reaching an upstream in
        # a shape nobody chose is a shape nobody can rely on. Rendered sorted,
        # so one identity produces identical header bytes every request.
        - name: x-auth-roles
          from: subject.roles
          encode: csv

        # `members:` renders one JSON object with operator-chosen keys, for
        # everything that would otherwise be a header each.
        - name: x-auth-context
          members:
            manager: claim.manager
            teams: subject.teams

      # `strip:` removes names no entry above targets. The user's raw JWT is
      # one: `delegate(...)` already replaces `authorization` with the minted
      # workday-api token, and this withholds the second copy, so the upstream
      # ends up holding no credential the user issued.
      #
      # `authorization` is deliberately absent from the request protocol floor
      # precisely so this is expressible. A floor header (`host`,
      # `content-type`, `content-length`, `transfer-encoding`) fails the load
      # rather than breaking traffic.
      strip:
        - x-user-token

  # ----------------------------------------------------------------
  # CEL PDP — inline boolean predicates as the decision backend.
  # APL routes call into CEL via `cel:` steps; the expression
  # evaluates against the common attribute vocabulary (subject.*,
  # role.*, args.*, delegation.*, session.*) and returns a boolean:
  # true → allow, false (or any eval error) → fail-closed deny.
  #
  # CEL vs Cedar (see policy-cedar.yaml for the Cedar form): reach for CEL
  # when the decision is a self-contained boolean predicate authored
  # inline in the route — no external policy store, zero glue. Reach
  # for Cedar when policy lives outside the route (versioned/signed
  # policy sets) or needs the full entity/relationship model. Here
  # both express the SAME decision so the two are directly comparable.
  #
  # `pdp:` is a `global:` key, and the only scope that accepts one: a PDP, the
  # session store and the static attribute tree are all process-global.
  # ----------------------------------------------------------------
  pdp:
    - kind: cel
      on_error: deny   # fail-closed; the default, spelled out

  # ----------------------------------------------------------------
  # Session store — where the engine persists taint labels.
  # ----------------------------------------------------------------
  # `taint(secret, session)` on get_compensation writes a `secret`
  # label keyed by H(subject : X-Session-Id); send_email reads it back
  # via `security.labels contains "secret"`. With this Valkey backend
  # the label survives a gateway restart and can be shared across
  # gateway instances (the default is an in-process store that resets
  # on restart). Valkey runs as the `valkey` compose service; the
  # gateway reaches it on localhost:6379. See scenarios 08 / 09.
  #
  # A `global:` key, like `pdp:` above and for the same reason.
  #
  # Optional keys (read by the valkey factory):
  #   key_prefix: "taint:v1"   # default key namespace
  #   tls: true                # required for non-localhost endpoints
  #   username: / password:    # Valkey 6+ ACL auth (pair them)
  #   ttl_seconds: 86400       # sliding label expiry (default: none)
  #   connect_timeout_ms / command_timeout_ms  # defaults 250 / 500
  session_store:
    kind: valkey
    endpoint: localhost:6379

routes:

  # ----------------------------------------------------------------
  # get_compensation
  # ----------------------------------------------------------------
  # Scenarios: 01 (Bob allow), 02 (Alice deny), 03 (Eve redact),
  #            08 (Bob taint → send_email deny), 09 (cross-principal isolation)
  #
  # What the policy does:
  #   1. require(role.hr)          — only HR-role callers proceed; anyone
  #                                  else (e.g. Alice/engineer) gets -32001
  #                                  before any IdP call is made.
  #   2. delegate(workday-oauth)   — exchanges the user's JWT for a
  #                                  workday-api-scoped token (RFC 8693).
  #                                  The Authorization header that reaches
  #                                  the upstream MCP server is the MINTED
  #                                  token, not the user's original JWT.
  #   3. taint(secret, session)    — marks this session as having touched
  #                                  secret data. The label persists in the
  #                                  Valkey session store keyed by
  #                                  H(subject:session_id), so a later
  #                                  send_email in the same session is denied
  #                                  even if the email body is clean (scenario 08).
  #   4. run(audit-log)            — emits a structured JSON record before
  #                                  the call reaches upstream.
  #   5. args.ssn / result.ssn     — field-level redaction on both the request
  #                                  body (what upstream sees) and the response
  #                                  body (what the client sees). Callers with
  #                                  perm.view_ssn receive the real value;
  #                                  everyone else gets "[REDACTED]".
  #
  # Expected outcomes:
  #   Bob   (role.hr, perm.view_ssn)  → 200 OK; upstream gets minted workday
  #                                      token; SSN intact in both directions
  #   Alice (role.engineer, no hr)    → -32001, violation=pre_invocation[0]
  #                                      (require(role.hr)); no token exchange
  #   Eve   (role.hr, no view_ssn)    → 200 OK; upstream sees args.ssn=
  #                                      "[REDACTED]"; client sees result.ssn=
  #                                      "[REDACTED]"
  # ----------------------------------------------------------------
  - tool: get_compensation
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, permissions: [read_compensation])"
        - "taint(secret, session)"
        - "run(audit-log)"
    args:
      ssn: "str | redact(!perm.view_ssn)"
    result:
      ssn: "str | redact(!perm.view_ssn)"

  # ----------------------------------------------------------------
  # search_repos
  # ----------------------------------------------------------------
  # Scenarios: 04 (Alice internal allow), 05 (Alice external deny),
  #            06 (Bob APL deny)
  #
  # What the policy does (four-layer gauntlet):
  #   1. require(team.engineering | team.security)
  #                              — APL coarse gate. Bob (team.hr) is
  #                                rejected here immediately; PDP is
  #                                never invoked and no IdP round-trip
  #                                occurs (scenario 06, -32001).
  #   2. cel: expr               — CEL fine-grained PDP (same decision
  #                                expressed in Cedar in policy-cedar.yaml
  #                                and OPA/Rego in policy-opa.yaml). A
  #                                single boolean expression evaluated
  #                                inline against the common attribute
  #                                vocabulary:
  #                                  • engineer && visibility=internal → true
  #                                  • security (any visibility)       → true
  #                                  • anything else                   → false
  #                                CEL uses has() guards to avoid
  #                                undefined-key errors on callers who
  #                                lack the role entirely. false →
  #                                violation=cel.policy_denied (scenario 05).
  #   3. delegate(github-oauth)  — exchanges the user's JWT for a
  #                                github-api-scoped token. Keycloak's
  #                                gh-permissions-as-scope claim mapper
  #                                injects the user's gh_permissions
  #                                attribute as the `permissions` claim in
  #                                the minted token.
  #   4. permissions check       — asserts the minted token actually
  #                                carries repo:read:internal. Fail-safe
  #                                guard in case the IdP under-grants.
  #
  # Expected outcomes:
  #   Alice (engineer, visibility=internal)  → 200 OK; upstream gets minted
  #                                             github-api token with
  #                                             permissions=[repo:read:internal]
  #   Alice (engineer, visibility=external)  → -32001, violation=cel.policy_denied;
  #                                             no token exchange; GitHub never sees
  #                                             the request (scenario 05)
  #   Bob   (hr, any visibility)             → -32001, violation=pre_invocation[0]
  #                                             (APL gate); PDP not reached (scenario 06)
  # ----------------------------------------------------------------
  - tool: search_repos
    authorization:
      pre_invocation:
        - "require(team.engineering | team.security)"
        - cel:
            expr: |
              (has(role.engineer) && role.engineer && args.visibility == "internal")
              || (has(role.security) && role.security)
            on_deny:
              - "deny('engineering may read internal repos only; security may read any', 'cel.policy_denied')"
        - "delegate(github-oauth, target: github-api, audience: github-api, permissions: [repo:read:internal])"
        - "!(delegation.granted.permissions contains 'repo:read:internal'): deny"
        - "run(audit-log)"

  # ----------------------------------------------------------------
  # send_email
  # ----------------------------------------------------------------
  # Scenarios: 07 (Bob PII deny), 08 (Bob taint deny),
  #            09 (cross-principal isolation — 200 expected)
  #
  # What the policy does (two independent deny paths):
  #   1. require(perm.email_send)  — only callers with the email_send
  #                                  permission proceed.
  #   2. run(audit-log)            — records the attempt BEFORE the
  #                                  deny plugins run, so denied emails
  #                                  are still on the audit trail.
  #   3. run(pii-scan)             — walks all tool args for SSN /
  #                                  credit-card patterns. On a match,
  #                                  refuses with violation=pii.detected
  #                                  (scenario 07). Content-based; fires
  #                                  regardless of session history.
  #   4. taint check               — inspects session.labels. If the
  #                                  resolved subject's session was
  #                                  previously tainted by get_compensation,
  #                                  denies with violation=
  #                                  session_tainted_secret even if the
  #                                  email body is completely clean
  #                                  (scenario 08). Taint is subject-
  #                                  scoped: H(subject:session_id), so a
  #                                  different user sharing the same
  #                                  session id is NOT affected (scenario 09).
  #
  # Expected outcomes:
  #   Bob (email_send, SSN in body)              → -32001, violation=pii.detected;
  #                                                 backend never reached; audit
  #                                                 record still emitted (scenario 07)
  #   Bob (email_send, clean body, tainted sess) → -32001, violation=
  #                                                 session_tainted_secret (scenario 08)
  #   Bob (email_send, clean body, clean sess)   → 200 OK (scenario 09 baseline)
  # ----------------------------------------------------------------
  - tool: send_email
    authorization:
      pre_invocation:
        - "require(perm.email_send)"
        - "run(audit-log)"
        - "run(pii-scan)"
        - "security.labels contains \"secret\": deny('external email blocked: this session accessed secret data', 'session_tainted_secret')"

  # ----------------------------------------------------------------
  # adjust_compensation
  # ----------------------------------------------------------------
  # Scenarios: 10 (under-threshold, no approval), 11 (over-threshold,
  #            manager CIBA approval required)
  #
  # What the policy does:
  #   1. require(role.hr)          — HR-only gate, same as get_compensation.
  #   2. when: args.amount > 10000 — conditional human-in-the-loop. Small
  #      require_approval(...)       adjustments (≤$10k) go straight through
  #                                  (scenario 10, 200 OK). Larger amounts
  #                                  trigger an OIDC CIBA out-of-band approval
  #                                  request to the caller's manager
  #                                  (claim.manager). The gateway suspends
  #                                  the call with -32120 (pending, NOT a
  #                                  deny) and polls Keycloak until the
  #                                  manager approves or the 24h timeout
  #                                  elapses. The approval is scoped to
  #                                  args.amount <= 25000, so a sign-off
  #                                  can't be replayed against a larger
  #                                  change (scenario 11).
  #   3. run(audit-log)            — records the attempt.
  #
  # No PDP step — this route behaves identically under Cedar, CEL, and OPA.
  #
  # Expected outcomes:
  #   Bob (role.hr, amount=$5,000)  → 200 OK, status="applied"; no approval
  #                                    flow triggered (scenario 10)
  #   Bob (role.hr, amount=$25,000) → -32120 (pending); gateway polls CIBA;
  #                                    once manager approves → 200 OK,
  #                                    status="applied" (scenario 11)
  # ----------------------------------------------------------------
  - tool: adjust_compensation
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - when: "args.amount > 10000"
          do:
            - "require_approval(manager-approver, from: claim.manager, channel: \"ciba\", scope: \"args.amount <= 25000\", purpose: \"Approve a compensation adjustment\", timeout: 24h)"
        - "run(audit-log)"

  # Workload identity: the agent acts as itself, with no human user involved.
  # replace_inherited drops the global user and client resolvers, so this
  # route authenticates by the agent's SPIFFE JWT-SVID alone. The delegate
  # step runs `subject: caller_workload`, which drives the OAuth delegator's
  # two legs: leg 1 presents the SVID as an RFC 7523 client assertion
  # (jwt-spiffe) to authenticate as the agent's Keycloak client, and leg 2
  # exchanges that token for a workday-api token. The agent holds no standing
  # workday-api entitlement; the gateway obtains one for the call.
  # Needs the SPIRE overlay: see "Workload identity" in the README.
  - tool: get_headcount
    authentication:
      replace_inherited: true
      steps:
        - jwt-workload
    # The global assertions describe a person (x-auth-user-id from subject.id,
    # which this route never resolves, with on_missing: deny), so this route
    # replaces them. Asserting the agent's identity instead is not possible yet:
    # assertion sources cover subject.*, claim.* and client.*, not
    # caller_workload.*. replace_inherited also drops the inherited strip list,
    # so the raw-token strip is restated, and x-auth-* is stripped: without the
    # global entries nothing else removes a caller's own x-auth-user-id before
    # it reaches hr-mcp, which is the spoof scenario 12 refuses.
    assertions:
      request:
        replace_inherited: true
        strip:
          - x-user-token
          - x-auth-*
    authorization:
      pre_invocation:
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, permissions: [read_compensation], subject: caller_workload)"
        - "!delegation.granted: deny"
        - "run(audit-log)"
