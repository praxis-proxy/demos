# SPIRE agent for the Praxis Policy Engine HR demo.
#
# The agent joins the server with a one-time join token that restart.sh
# generates (node attestation), then serves the SPIFFE Workload API on a
# socket shared with the `workloads` container. When a process there asks for
# an SVID, the agent identifies it with the `unix` workload attestor (by its
# uid, read from the kernel, not from anything the process says) and issues
# the SVID of the registration entry whose selectors match.

agent {
    data_dir          = "/opt/spire/data/agent"
    log_level         = "INFO"
    server_address    = "spire-server"
    server_port       = "8082"
    socket_path       = "/opt/spire/sockets/agent.sock"
    trust_domain      = "policy.demo"
    # The server's CA bundle, exported by restart.sh before the agent starts,
    # so the agent only talks to the server it was given.
    trust_bundle_path = "/opt/spire/conf/agent/bootstrap.crt"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
