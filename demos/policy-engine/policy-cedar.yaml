# Keycloak + CEDAR policy for the HR demo.
# Run: GATEWAY_CONFIG=praxis.yaml ./restart.sh
# See README.md for the scenarios and alternate IdP configurations.

engine_settings:
  dispatch: policy

plugins:
  # User identity. Carries the human's roles + permissions claims.
  - name: jwt-user
    capabilities:
      # Required for outbound IdP requests.
      - perform_http
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: user
      header: X-User-Token
      trusted_issuers:
        - issuer: "http://localhost:8081/realms/policy-demo"
          audiences: ["praxis-gateway"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/certs"
            insecure_http: true   # localhost dev — never production
          leeway_seconds: 60
        - issuer: "https://praxis-1.verify.ibm.com/oauth2"
          audiences: ["praxis-gateway"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "https://praxis-1.verify.ibm.com/oauth2/jwks"
          leeway_seconds: 60
      claim_mapper: standard

  # Client identity. Carries the agent's client_id / azp.
  - name: jwt-client
    capabilities:
      # Required for outbound IdP requests.
      - perform_http
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: client
      header: Authorization
      trusted_issuers:
        - issuer: "http://localhost:8081/realms/policy-demo"
          audiences: ["praxis-gateway", "account"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/certs"
            insecure_http: true   # localhost dev — never production
          leeway_seconds: 60
        - issuer: "https://praxis-1.verify.ibm.com/oauth2"
          audiences: ["praxis-gateway", "account"]
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "https://praxis-1.verify.ibm.com/oauth2/jwks"
          leeway_seconds: 60
      claim_mapper: standard

  # Validate X-Workload-Token against SPIRE and populate security.caller_workload.
  # Used by scenario 13; requires the SPIRE overlay.
  - name: jwt-workload
    capabilities:
      - perform_http
    kind: identity/jwt
    hooks: [identity.resolve]
    mode: sequential
    on_error: fail
    config:
      role: caller_workload
      header: X-Workload-Token
      trusted_issuers:
        - issuer: "http://spire-oidc:8443"
          audiences: ["http://localhost:8081/realms/policy-demo"]
          algorithms: ["ES256"]
          decoding_key:
            kind: jwks_url
            # Reached from the host gateway on the published port
            # (inside compose it is spire-oidc:8443).
            url: "http://localhost:8443/keys"
            insecure_http: true   # localhost dev — never production
          leeway_seconds: 60
      claim_mapper: standard

  # Exchange the user token for Workday access; retain the user permissions.
  - name: workday-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    mode: sequential
    on_error: fail
    capabilities:
      # Required for outbound IdP requests.
      - perform_http
      - read_inbound_credentials
      - write_delegated_tokens
    config:
      token_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/token"
      insecure_http: true   # localhost dev — never production
      client_id: "praxis-gateway"
      # Secret source. `kind: literal` is an inline secret (dev only).
      # Other kinds: `kind: env_var` with `name:` (read from the
      # environment at startup) and `kind: file` with `path:` (read from
      # a file). Prefer env_var or file in production; do not commit
      # secrets to YAML.
      client_secret_source:
        kind: literal
        secret: "praxis-gateway-secret"
      timeout_seconds: 5
      default_outbound_header: "Authorization"

  # Scan tool arguments for PII before invocation.
  - name: pii-scan
    kind: validator/pii-scan
    hooks: [cmf.tool_pre_invoke]
    mode: sequential
    on_error: fail
    config:
      detect:
        - { kind: ssn }
        - { kind: credit_card }
      mode: deny

  # Emit JSON audit records for tool calls.
  - name: audit-log
    kind: audit/logger
    hooks:
      - cmf.tool_pre_invoke
    mode: sequential
    # Run last to record the decision and delegated tokens.
    on_error: ignore  # observation failures don't halt traffic
    capabilities:
      - read_subject
      - read_client
      - read_meta
      - read_delegated_tokens
    config:
      destination: stderr
      source: policy-demo-gateway

  # Verify echoes the requested scope. The permissions assertion below checks
  # the exchanged token; it does not prove an IdP entitlement decision.
  - name: github-oauth
    kind: delegator/oauth
    hooks: [token.delegate]
    mode: sequential
    on_error: fail
    capabilities:
      # Required for outbound IdP requests.
      - perform_http
      - read_inbound_credentials
      - write_delegated_tokens
    config:
      token_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/token"
      insecure_http: true
      client_id: "praxis-gateway"
      client_secret_source:
        kind: literal
        secret: "praxis-gateway-secret"
      timeout_seconds: 5
      default_outbound_header: "Authorization"

  # Request manager approval through Keycloak CIBA. Pending calls return -32120.
  - name: manager-approver
    capabilities:
      # Required for outbound IdP requests.
      - perform_http
    kind: elicitation/ciba
    hooks: [elicit]
    mode: sequential
    on_error: fail
    config:
      backchannel_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/ext/ciba/auth"
      token_endpoint: "http://localhost:8081/realms/policy-demo/protocol/openid-connect/token"
      insecure_http: true   # localhost dev — never production
      client_id: "praxis-gateway"
      client_secret_source:
        kind: literal
        secret: "praxis-gateway-secret"
      scope: openid
      approver_claim: preferred_username
      default_requested_expiry_seconds: 120

global:
  authentication:
    - jwt-user
    - jwt-client

  # Assert engine-derived identity in upstream headers (scenario 12).
  # These headers are unsigned; the backend must trust its connection to the gateway.
  assertions:
    request:
      headers:
        # Require the resolved subject id.
        - name: x-auth-user-id
          from: subject.id
          on_missing: deny

        # The human-readable name, for the demo log. A claim, not a slot.
        - name: x-auth-username
          from: claim.preferred_username

        # Encode the sorted collection explicitly for stable header values.
        - name: x-auth-roles
          from: subject.roles
          encode: csv

        # `members:` renders one JSON object with operator-chosen keys, for
        # everything that would otherwise be a header each.
        - name: x-auth-context
          members:
            manager: claim.manager
            teams: subject.teams

      # Strip the original user token. Delegation replaces Authorization with
      # the exchanged token. Protocol headers such as Host cannot be stripped.
      strip:
        - x-user-token

  pdp:
    - kind: cedar-direct
      dialect: cedar
      policy_text: |
        // Engineers can read INTERNAL repos. The relationship
        // (principal's role x resource's visibility) is the
        // archetypal Cedar shape.
        @id("engineering-internal-repos")
        permit(
          principal,
          action == Action::"read",
          resource is Repo
        ) when {
          principal.roles.contains("engineer") &&
          resource.visibility == "internal"
        };

        // Security team can read ANY repo regardless of visibility.
        @id("security-team-any-repo")
        permit(
          principal,
          action == Action::"read",
          resource is Repo
        ) when {
          principal.roles.contains("security")
        };

        // Default-deny otherwise. Cedar's defaults make this
        // implicit but spelling it out documents intent.

  # Persist session taint in Valkey across gateway restarts (scenarios 08/09).
  # Labels are keyed by subject and session id.
  session_store:
    kind: valkey
    endpoint: localhost:6379

routes:

  # Compensation access and SSN redaction: scenarios 01-03.
  # Reading compensation taints the session: scenarios 08/09.
  - tool: get_compensation
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, permissions: [read_compensation])"
        - "taint(secret, session)"
        - "run(audit-log)"
    args:
      ssn: "str | redact(!perm.view_ssn)"
    result:
      ssn: "str | redact(!perm.view_ssn)"

  # Repository access: scenarios 04-06. Check the team, consult the PDP,
  # exchange the token, then check its permissions.
  - tool: search_repos
    authorization:
      pre_invocation:
        - "require(team.engineering | team.security)"
        - cedar:
            action: 'Action::"read"'
            resource:
              type: Repo
              id: ${args.repo_name}
              attributes:
                visibility: ${args.visibility}
        - "delegate(github-oauth, target: github-api, audience: github-api, permissions: [repo:read:internal])"
        - "!(delegation.granted.permissions contains 'repo:read:internal'): deny"
        - "run(audit-log)"

  # Email permission, PII scanning, and session-taint checks: scenarios 07-09.
  # Audit before denial so blocked attempts are recorded.
  - tool: send_email
    authorization:
      pre_invocation:
        - "require(perm.email_send)"
        - "run(audit-log)"
        - "run(pii-scan)"
        - "security.labels contains \"secret\": deny('external email blocked: this session accessed secret data', 'session_tainted_secret')"

  # Compensation adjustments: scenario 10 applies amounts up to $10K;
  # scenario 11 requires manager approval.
  - tool: adjust_compensation
    authorization:
      pre_invocation:
        - "require(role.hr)"
        - when: "args.amount > 10000"
          do:
            - "require_approval(manager-approver, from: claim.manager, channel: \"ciba\", scope: \"args.amount <= 25000\", purpose: \"Approve a compensation adjustment\", timeout: 24h)"
        - "run(audit-log)"

  # Scenario 13 authenticates with the workload SVID alone, exchanges it for
  # a Workday token, and strips caller-supplied user identity headers.
  - tool: get_headcount
    authentication:
      replace_inherited: true
      steps:
        - jwt-workload
    # Replace user assertions and strip caller-supplied identity headers.
    assertions:
      request:
        replace_inherited: true
        strip:
          - x-user-token
          - x-auth-*
    authorization:
      pre_invocation:
        - "delegate(workday-oauth, target: workday-api, audience: workday-api, permissions: [read_compensation], subject: caller_workload)"
        - "!delegation.granted: deny"
        - "run(audit-log)"
