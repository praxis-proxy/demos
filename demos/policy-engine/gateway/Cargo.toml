[package]
name = "policy-engine-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "policy-engine-gateway"
path = "src/main.rs"

[dependencies]
praxis-ai-proxy = { git = "https://github.com/praxis-proxy/ai", rev = "c39f7198", features = ["praxis-main"] }
# Enable the policy filter used by this gateway.
praxis-proxy-filter = { version = "0.7.5", features = ["policy-engine"] }
# praxis-ai's server calls the admin endpoint helpers.
praxis-proxy-protocol = { version = "0.7.5", features = ["admin-api"] }

# Unpublished reference plugins, registered in src/main.rs.
praxis-policy-plugin-pii-scanner = { path = ".policy/reference/plugins/pii-scanner" }
praxis-policy-plugin-audit-logger = { path = ".policy/reference/plugins/audit-logger" }

# Local plugin for IBM Verify Agent Registry status checks.
praxis-policy-plugin-agent-status = { path = "plugins/agent-status" }

clap = { version = "4", features = ["derive"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "0.7"

# Share the policy core and orchestration crates with the path-based plugins.
# The .policy checkout must match the engine version required by Praxis; a
# version mismatch leaves duplicate crates and incompatible PluginFactory traits.
# See DEFAULT_PPE_REF in build-gateway.sh.
[patch.crates-io]
praxis-policy-core = { path = ".policy/crates/ppe-core" }
praxis-policy-orchestration = { path = ".policy/crates/ppe-orchestration" }
