# IBM Verify + CEDAR gateway.
# Run: USE_VERIFY=true GATEWAY_CONFIG=praxis-verify-cedar.yaml ./restart.sh
# Edit policy-verify-cedar.yaml.tmpl; restart.sh renders the policy file.

listeners:
  - name: gateway
    address: "127.0.0.1:8090"
    protocol: http
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: mcp
        # Defaults are fine. Reads body, writes mcp.method / mcp.name
        # into ctx.filter_metadata.

      - filter: policy
        config_path: ./policy-verify-cedar.yaml
        # Allow the local Keycloak approval endpoint and any trusted Keycloak issuer.
        allow_private_idp: true
        body_access: read_write

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: hr-mcp-backend

      - filter: load_balancer
        clusters:
          - name: hr-mcp-backend
            endpoints:
              # Host-bound port of the docker-compose `hr-mcp` service.
              - "127.0.0.1:9100"

# The MCP backend and Valkey run locally.
insecure_options:
  allow_private_endpoints: true # demo proxies to local backends
