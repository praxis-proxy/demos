# Praxis listener for the HR demo, CEL variant. Identical to praxis.yaml except
# the policy filter loads policy-cel.yaml (CEL PDP) instead of policy.yaml
# (Cedar PDP). Run with:
#
#   GATEWAY_CONFIG=praxis-cel.yaml ./restart.sh

listeners:
  - name: gateway
    address: "127.0.0.1:8090"
    protocol: http
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: mcp
        # Defaults are fine. Reads body, writes mcp.method / mcp.name
        # into ctx.filter_metadata.

      - filter: policy
        config_path: ./policy-cel.yaml
        # Keycloak runs on localhost here. The engine refuses loopback and
        # private IdP addresses by default, since a jwks_url in a policy
        # document is an SSRF primitive when anyone but the operator can set it.
        allow_private_idp: true
        body_access: read_write

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: hr-mcp-backend

      - filter: load_balancer
        clusters:
          - name: hr-mcp-backend
            endpoints:
              # Host-bound port of the docker-compose `hr-mcp` service.
              - "127.0.0.1:9100"

# The demo's backends are all on localhost: the mock HR MCP server on :9100,
# Keycloak on :8081, Valkey on :6379. Praxis refuses a private or loopback
# endpoint unless a config says so out loud, which is the right default for a
# proxy and an explicit opt-in for a demo that runs entirely on one machine.
insecure_options:
  allow_private_endpoints: true # demo proxies to local backends
