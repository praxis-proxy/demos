# Praxis listener for the AuthPolicy → CEL generic-HTTP (L7) demo.
#
# Chain: policy → router → load_balancer. There is NO `mcp` filter and no
# `body_access` — this is pure L7 admission control. The `policy` filter
# resolves the JWT identity and evaluates the emitted `global` policy
# (CEL over http.* + top-level claims) at request admission:
#
#   * allowed  → forwarded to the echo backend (HTTP 200)
#   * authz deny → Praxis default L7 deny (HTTP 403)
#   * no / invalid token → identity gate (HTTP 401)
#
# `config_path` points at the transpiler output written by run-demo.sh into
# ./out. Run with `./run-demo.sh` (or `praxis -c praxis.yaml`
# once ./out is populated and Keycloak is up).

listeners:
  - name: gateway
    address: "127.0.0.1:8095"
    protocol: http
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: policy
        config_path: ./out/jwt-cel-http-policy-doc.yaml
        # Keycloak runs on localhost here. The engine refuses loopback and
        # private IdP addresses by default, since a jwks_url in a policy
        # document is an SSRF primitive when anyone but the operator can set it.
        allow_private_idp: true

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: echo-backend

      - filter: load_balancer
        clusters:
          - name: echo-backend
            endpoints:
              - "127.0.0.1:9200"

# The echo backend runs on loopback. Praxis refuses private and loopback
# upstreams by default, which is the right default for a real proxy and an
# explicit opt-in for a demo that runs entirely on one machine. Distinct from
# the policy filter's `allow_private_idp`, which governs the engine's own
# outbound calls to the IdP.
insecure_options:
  allow_private_endpoints: true
