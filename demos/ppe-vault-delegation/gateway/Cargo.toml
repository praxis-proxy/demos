[package]
name = "ppe-vault-demo-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ppe-vault-demo-gateway"
path = "src/main.rs"

[workspace]
resolver = "3"
exclude = [".policy", ".policy-checkout"]

[workspace.dependencies]
praxis-ai-proxy = { git = "https://github.com/praxis-proxy/ai", rev = "66d45b47a1e9b60c51bd592b4022bf520862ea25" }
praxis-proxy-filter = "0.7.3"
praxis-proxy-protocol = "0.7.3"
clap = "4.6.7"
tracing = "0.1.44"
tikv-jemallocator = "0.7.0"

[dependencies]
praxis-ai-proxy = { workspace = true, features = ["praxis-main"] }
praxis-proxy-filter = { workspace = true, features = ["policy-engine", "chain-binding"] }
praxis-proxy-protocol = { workspace = true, features = ["admin-api"] }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = { workspace = true }

# PR #168 is not released yet. build-gateway.sh resolves gateway/.policy to a
# checkout carrying that PR; this patch makes praxis's policy filter use it.
[patch.crates-io]
praxis-policy = { path = ".policy/crates/ppe" }
