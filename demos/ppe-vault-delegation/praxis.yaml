# Praxis AI + PPE gateway for the Vault Community delegation demo.
listeners:
  - name: gateway
    address: "127.0.0.1:8090"
    protocol: http
    filter_chains: [main]

filter_chains:
  - name: main
    filters:
      - filter: mcp
      - filter: policy
        config_path: ./.state/policy.yaml
        # Vault is deliberately bound to loopback in this development recipe.
        # This relaxes policy callouts only; do not use it in production.
        allow_private_idp: true
        body_access: read_write
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: github-bridge
      - filter: load_balancer
        clusters:
          - name: github-bridge
            endpoints: ["127.0.0.1:9100"]

insecure_options:
  # Both demo dependencies bind to loopback. Production deployments should
  # use routable private service addresses plus TLS and normal egress policy.
  allow_private_endpoints: true
