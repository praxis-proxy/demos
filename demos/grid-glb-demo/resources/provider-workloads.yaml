apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcr-inference
  namespace: grid-system
  labels:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/part-of: grid-glb-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-vcr
      app.kubernetes.io/instance: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-vcr
        app.kubernetes.io/instance: primary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vcr
          image: "{{ cluster.properties.vcrImage }}"
          imagePullPolicy: "{{ cluster.properties.imagePullPolicy }}"
          env:
            - name: MODEL
              value: "Qwen/Qwen3-0.6B"
            - name: MOCK_PD_ROLE
              value: "both"
            - name: VLLM_PORT
              value: "8000"
            - name: MOCK_MAX_NUM_SEQS
              value: "4"
            - name: MOCK_KV_CACHE_SIZE
              value: "64"
            - name: MOCK_MAX_MODEL_LEN
              value: "512"
            - name: MOCK_TTFT_MS
              value: "50"
            - name: MOCK_ITL_MS
              value: "20"
            - name: MOCK_TIME_FACTOR_UNDER_LOAD
              value: "2.0"
            - name: MOCK_EXPECTED_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vcr-inference-credential
                  key: token
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vcr-inference
  namespace: grid-system
  labels:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/part-of: grid-glb-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm-vcr
    app.kubernetes.io/instance: primary
  ports:
    - name: http
      port: 8000
      targetPort: 8000
