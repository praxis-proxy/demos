# File Search — Vector Store Callout via OGX
#
# Demonstrates the `openai_file_search_callout` filter with
# `iterative_request_router` for server-side file search.
#
# The model emits a `file_search_call` (or vLLM's
# `function_call(name=file_search)`), Praxis translates and
# dispatches to OGX's vector store search API, feeds results
# back to the model, and the model produces a final answer
# with citations.
#
# Pipeline (pre-IRR, runs once):
#   1. openai_responses_format — classify the request
#   2. openai_responses_validate — validate parameters
#
# IRR inference step (loops on pending search results):
#   Request:  tool_parse → file_search_callout
#             → responses_proxy → router → load_balancer
#   Response: load_balancer → router → responses_proxy
#             → file_search_callout → tool_parse
#
#   file_search_callout executes vector store search when the
#   model emits a file_search_call, then triggers a loop
#   transition back to inference with search context.
#
# Build:
#   cargo build -p praxis-ai-proxy --release

listeners:
  - name: ai-gateway
    address: "127.0.0.1:8080"
    filter_chains: [file-search-pipeline]

filter_chains:
  - name: file-search-pipeline
    filters:
      - filter: openai_responses_format
        on_invalid: reject
        headers:
          format: x-praxis-ai-format
          model: x-praxis-ai-model
          stream: x-praxis-ai-stream

      - filter: openai_responses_validate

      - filter: iterative_request_router
        initial_step: inference
        max_iterations: 8
        timeout_ms: 120000
        step_timeout_ms: 120000
        max_response_bytes: 67108864
        max_state_bytes: 136314880
        steps:
          - name: inference
            filters:
              - filter: openai_tool_parse
              - filter: openai_file_search_callout
                vector_store_url: http://127.0.0.1:8321
                allow_private_url: true
                timeout_ms: 30000
                max_response_bytes: 10485760
                max_total_response_bytes: 67108864
                max_state_bytes: 136314880
                callout_failure_mode: closed
                forward_headers:
                  - authorization
              - filter: openai_responses_proxy
                name: inference
              - filter: headers
                request_set:
                  - name: Content-Type
                    value: application/json
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: "inference"
              - filter: load_balancer
                clusters:
                  - name: "inference"
                    endpoints:
                      - "127.0.0.1:8000"
                    read_timeout_ms: 120000
            on_result:
              - filter: openai_file_search_callout
                key: pending
                value: "true"
                next: inference
              - default: true
                done: true
