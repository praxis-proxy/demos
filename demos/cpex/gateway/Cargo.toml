# Copyright (c) 2026 Praxis Contributors
#
# Thin gateway binary for the CPEX HR demo. Composes praxis-ai's AI filters
# (mcp classifier, …) with the CPEX/HIL `policy` filter by:
#   * depending on praxis-ai's server (which auto-registers the AI filters), and
#   * enabling `cpex-policy-engine`, which auto-registers the `policy` filter via
#     praxis-proxy-filter's own builtins registry.
# No manual filter registration.
#
# Previously `[patch]`ed praxis-proxy-* onto a personal HIL fork
# (terylt/praxis:feat/hil_apl) pending upstream merge. Verified Aug 11 2026:
# every piece of that fork's one remaining commit (elicitation error codes,
# header carry, the on_request 401 fix, mcp metadata naming) is already
# present in published praxis via later refactors (PR #820, #912, and
# others) — confirmed by a clean 80/80-passing run of
# praxis-proxy-filter's policy test suite on unpatched main. Patch dropped;
# this now builds against published praxis directly.
[package]
name = "cpex-praxis-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cpex-praxis-gateway"
path = "src/main.rs"

[dependencies]
# praxis-ai's server (unmodified upstream) — registers the AI filters and
# exposes `run_server`.
praxis-ai-proxy = { git = "https://github.com/praxis-proxy/ai", rev = "3ef40ace44dbb0e98dde84c83b504a490a1c30c5" }
# Declared only to turn on the cpex/policy engine feature graph-wide.
# Pinned to the same git tag as `ai`'s own praxis-proxy-filter dependency
# (rather than the crates.io registry version) so Cargo resolves a single
# shared instance — otherwise the two sources produce two separate copies
# of the crate, and the AI server's filter registry silently builds from
# the copy that never had `cpex-policy-engine` enabled.
praxis-proxy-filter = { git = "https://github.com/praxis-proxy/praxis.git", tag = "v0.5.2", features = ["cpex-policy-engine"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
tikv-jemallocator = "0.7"
