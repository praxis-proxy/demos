# -- Site name. Names the InferencePool and labels the model pods, so the two
# sites stay distinct candidates while serving the same model.
site: ""

# -- Model served at every site. Grid matches on this name, so it is the same
# everywhere; the site is what differs.
model: Qwen/Qwen3-0.6B

simulator:
  repository: ghcr.io/llm-d/llm-d-inference-sim
  tag: v0.10.2
  pullPolicy: IfNotPresent
  # -- Model pods behind this site's pool, the endpoints the picker chooses between.
  replicas: 2
  port: 8000
  # -- Concurrent requests one pod admits. The queue the picker scores builds past it.
  maxNumSeqs: 4
  maxModelLen: 512
  timeToFirstToken: 200ms
  interTokenLatency: 20ms

endpointPicker:
  repository: ghcr.io/llm-d/llm-d-router-endpoint-picker
  tag: v0.11.0
  pullPolicy: IfNotPresent
  grpcPort: 9002
  healthPort: 9003
  metricsPort: 9090

envoy:
  repository: docker.io/envoyproxy/envoy
  tag: distroless-v1.33.2
  pullPolicy: IfNotPresent
  port: 8081
  readyPort: 19001
  # -- Pinned, so the Grid provider gateway can name this endpoint in its values
  # without a capture step. Praxis refuses a private hostname as an endpoint.
  clusterIP: 10.96.0.100
