# Provider gateway for site-b. Admits peers on their SPIFFE ID and forwards to the
# local Envoy, which is where llm-d picks the pod. Its load balancer address is
# also where peers poll this site's signals, on the operator's port 9091.

fullnameOverride: provider-gateway

image:
  repository: ghcr.io/praxis-proxy/grid-gateway
  tag: v0.3.0-rc.3
  flavor: grid-gateway
  pullPolicy: IfNotPresent

grid:
  siteName: site-b

praxisConfig:
  source: render
  render:
    role: provider
    model: Qwen/Qwen3-0.6B
    peerTrust:
      mode: spiffe
      spiffeIds:
        - spiffe://grid.internal/site/site-a
        - spiffe://grid.internal/site/site-b
    backends:
      - cluster: local
        endpoints:
          - "10.96.0.100:8081"
        transport:
          mode: plaintext

gridIdentity:
  tlsSecretName: grid-site-identity
  caSecretName: grid-ca

service:
  enabled: true
  type: LoadBalancer
  port: 8443
  annotations:
    metallb.io/loadBalancerIPs: "10.90.0.222"
    metallb.io/allow-shared-ip: provider-edge

podLabels:
  grid.praxis.fast/provider-site: site-b
