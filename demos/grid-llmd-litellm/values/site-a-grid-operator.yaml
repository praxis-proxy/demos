# Operator for site-a. It enrolls on first start, redeeming the invite Secret and
# writing grid-site-identity and grid-ca itself. Nothing hand-mints a certificate.

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.2.2
  pullPolicy: IfNotPresent

enrollment:
  enabled: true


signals:
  enabled: true
  peerIntervalSeconds: "2"
  service:
    annotations:
      metallb.io/loadBalancerIPs: "10.90.0.204"

swim:
  siteName: site-a

  service:
    enabled: true
    type: LoadBalancer
    port: 7946
    annotations:
      metallb.io/loadBalancerIPs: "10.90.0.201"

gateway:
  serviceName: provider-gateway
  port: "8443"
